name: Bug report
description: Something behaves differently from the spec, or crashes.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please write in English. For security issues, do not use this form: see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the actual behaviour.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should happen? Cite the scenario ID (for example LEX-001) or spec section if you can.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A short Aval program and the command you ran (for example `aval check file.aval`). Paste the JSON diagnostic output verbatim.
      render: text
    validations:
      required: true
  - type: input
    id: scenario
    attributes:
      label: Related scenario ID(s)
      placeholder: "LEX-001, TYP-014"
  - type: input
    id: version
    attributes:
      label: Aval version / commit
      description: Output of `aval --version` or the commit hash.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, architecture, Rust version if relevant"
  - type: dropdown
    id: ai
    attributes:
      label: Was an AI model involved in producing the failing code?
      options:
        - "No"
        - "Yes (please name the model below)"
        - "Not sure"
  - type: input
    id: model
    attributes:
      label: Model and version, if any
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and Discussions.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
